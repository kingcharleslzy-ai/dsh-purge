name: Update contributor avatars
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - CONTRIBUTORS.md
      - scripts/update-contributors.mjs
      - .github/workflows/contributors.yml
permissions:
  contents: write
concurrency:
  group: contributor-avatars
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked documentation dependencies
        run: npm ci --ignore-scripts --omit=dev --legacy-peer-deps
      - name: Refresh and validate credits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/update-contributors.mjs
          node scripts/update-contributors.mjs --check
          npm run check:docs
          git diff --check
      - name: Commit only generated documentation
        shell: bash
        run: |
          set -euo pipefail
          git add README.md README.zh-CN.md docs/README.en.md .github/contributors.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: refresh contributor avatars'
          # A concurrent human push must win: never force-push or overwrite it.
          git push origin HEAD:"${{ github.event.repository.default_branch }}"
