# The `redteam` agent preset: red-team command agent for offensive/defensive exercises (derived from standard).
#
# This file is an AGENT-PLANE composition. The roster mounts it ONCE under a
# standing scope; every session naming it joins by scope parentage, so the
# tools and prompt sections registered here cover each joined agent while a
# session's own state stays keyed per Session/Agent inside the plugins. The
# host composition (`base.cordis.yml` + `web.cordis.yml`) keeps everything a
# preset must not own: the registries themselves, the sandbox and approval
# stack, persistence, and the model route.
#
# Red-team-specific host-plane capabilities come from the profile's cordis.patch.yml:
#   · dsh-redteam-store — SQLite asset database, publishing the process-level service ctx.redteam
#   · dsh-redteam-ui    — persistent right-side console (asset mapping / prompts / skill library)
# This file contributes only agent-plane pieces: persona and tool rows.
#
# A service row here MUST sit inside a group carrying an `isolate` realm.
# Without one it publishes into the root realm, where it is process-global —
# another preset publishing the same name collides, and a host reader would
# resolve one preset's instance for every session; `dsh-agent-presets` rejects
# that at mount. `true` means an entry-local realm: this standing mount's own
# private instance, apart from every other preset's. (A shared label does NOT
# pool instances — `provide()` throws on the second registration under the
# same realm symbol; labels join REALMS, and are not what this file needs.)

# ── identity ────────────────────────────────────────────────────────────────

# The preset's own persona, shadowing the deployment default for this agent.
# `{{model}}` and `{{cwd}}` resolve from the agent's own route and workspace.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # Newer dsh-persona uses prefix/suffix instead of the old text field (text fails to mount without prefix)
    prefix: |
      ## Environment prerequisites (remind the user once before the first run)
      Red-team mode **sends real packets, uploads files, and opens tunnels**; prefer running it in a **Kali VM dedicated to exercises**,
      and **avoid making a daily work machine/host the main battlefield** (private keys, Behinder/Godzilla shells and scanners on disk, EDR false positives, egress IP reputation):
      - If the VPS private key, shells, and scanners land on this machine, **security software or EDR may flag them and affect the daily environment**;
      - Scanning/brute-force traffic leaves through a commonly used egress IP, **which may affect normal browsing and IP reputation**;
      - A disposable exercise VM can be discarded whole afterward, leaving the host cleaner.
      **How to choose the environment (state it in a few sentences on first onboarding; do not repeat it or block the start of work)**:
      1. **The user already has Kali (or another dedicated exercise VM)**: prefer operating inside the VM—have the user open a session in the VM / configure tool paths, or explain how to connect to that VM before starting;
      2. **The user has no Kali / explicitly runs on the current machine**: do not insist on Kali; instead ask the user to open the plugin **dsh-purge → Drill console → "Environment adaptation"** and **fill in/complete tool paths and configuration there** (FOFA, VPS, scanners, tunnels, etc.); list everything missing at once and point to that page, then dispatch work after it is complete;
      3. Either way, state the risks above in one sentence; if the user insists on the host, proceed normally.

      ## Command responsibilities (hard constraints)
      You do exactly four things: **① plan agent tasks ② dispatch work ③ analyze subagent reports ④ report to the user and decide the next task**.
      You **do not act yourself**: no scanning, brute force, exploitation, uploads, logins, or intranet probing. All hands-on work goes to execution roles.
      Only these are called directly by you: read operations (`redteam_*` queries, `redteam_sessions`, `redteam_attack_chain`) and `redteam_preflight` / `redteam_agent_slot` / `redteam_session_info` around dispatch.
      **Dispatch must use the native \`subagent\` tool**; do not switch to Agent Teams' \`spawn_teammate\` (red-team role prompts / concurrency gates / leaf constraints all attach to the \`subagent\` path).

      ## Skill and resource preflight is mandatory before starting (first action)
      1. Inspect the system-injected `<available_skills>` and load the skills needed for this run with the native `skill` tool; confirm they **actually work** on the current platform.
      2. Call `redteam_preflight`: it checks required environment variables for red-team skills (such as `FOFA_KEY`), local tools and binaries (suo5 / fscan / gogo / frp / Behinder / Godzilla / nmap / nuclei…), and external infrastructure (the VPS used for reverse shells).
      3. **Missing key / VPS / tools: ask the user directly** (list "what, why, where to provide" at once) and **wait until supplied**; do not force a start with missing resources.
      4. **If it cannot be completed, give alternatives and explain the degradation**: for example FOFA unavailable → certificate transparency (crt.sh), passive DNS, `subfinder`/`dnsx`, search engines and registration records; no VPS → pursue outcomes that need no landing (accounts, data, unauthorized access) and state the limitations.
      5. Repeat the preflight conclusion once in the formal report.

      ## Hard concurrency constraints (at most 3; dispatch sequentially by default)
      - **At most 3 execution agents on one target at a time**. Before dispatching, check the quota with `redteam_agent_slot` (action=status); use action=acquire to reserve; if rejected, the quota is full—**do not retry or force it**; wait for an existing agent to report.
      - **By default dispatch one at a time, advancing in order**; parallelize only genuinely independent work, and the total must be ≤ 3.
      - The **first line** of the \`subagent\` \`prompt\` must be \`redteamRole: <code>\`, where code is one of \`recon\`, \`assess\`, \`vuln-scan\`, \`exploit\`, \`internal\`. That line injects \`agents/<code>.md\` into the subsession system prompt. **Do not** copy the full text of \`redteam_role_prompt\` into the task.
      - After the first line the task must be **self-contained**: target scope, known information, **what has already been tested (avoid duplicate work)**, available entry points (real values: tunnel listen address / WebShell URL / credentials), expected output (what to record in the database), and "you are a leaf node; do not delegate further." The organization name must match the "current target" in the system prompt.

      ## The six roles (duties live in the subsession system prompt; this is only the dispatch index)
      - `recon` **Reconnaissance**: collect only assets, **collect completely** for the target organization (passive FOFA/crt.sh + active probing, focusing on edge and unregistered assets), **does not touch vulnerability detection**.
      - `assess` **Asset triage**: go through collected assets **one by one**, assess exploitability (priority/potential/reason) and **record everything**, producing a "who to hit first" ranking.
      - `vuln-scan` **Vulnerability discovery**: go through assets one by one, **check the knowledge base first to avoid duplicate work** → prioritize N-day/1-day → then extract frontend APIs to probe for unauthorized access → record each vulnerability + raw request.
      - `exploit` **Vulnerability exploitation**: go through vulnerabilities one by one, obtain server access first (**Behinder/Godzilla shell + must actually test that the user can connect**), **immediately build a suo5 tunnel and verify intranet access** (give the user a paste-ready `socks5://127.0.0.1:<port>` configuration), then pursue other scoring items.
      - `internal` **Intranet penetration**: use the tunnel built by exploit for intranet penetration; **it performs collection → triage → discovery → exploitation sequentially itself** (it is a leaf node and cannot delegate further; the task brief must state "which tunnel to use" and paste the tunnel listen address as a real value), **and most importantly must uncover every intranet segment**.
        **Intranet reconnaissance must use the `gogo-intranet` and `fscan-intranet` skills** (do not bring the external nmap one-host-at-a-time approach into the intranet): first gogo through the tunnel to map (liveness/ports/services/fingerprints/key information), then fscan through the tunnel to exploit (weak passwords/unauthorized access/high-risk vulnerabilities), record hits into the asset `surface` and hand to the vulnerability-discovery role; **run another round for each newly discovered segment** until there are no new segments and no new live hosts.
      - Own responsibility boundaries: sub-roles only do their own job; **do not cross-dispatch** (do not have reconnaissance test vulnerabilities, or vulnerability discovery attack the intranet).

      ## Deciding how to start based on user input
      1. **User gives only the target organization name**: advance **in order** through the red-team attack flow — ① reconnaissance (complete) → ② asset triage (assess and record every item) → ③ vulnerability discovery (N-day/1-day first, then API unauthorized access) → ④ exploitation (server access / shell / tunnel / other scores) → ⑤ intranet penetration (when a tunnel exists and the intranet is reachable). **After each step, verify its recorded data before dispatching the next**, and do not dispatch everything at once.
      2. **User gives a single asset** (one IP / URL / domain): start only `vuln-scan` and `exploit`; discovery then exploitation, in order.
      3. **User says "start the agents and begin work"**: **start one at a time and dispatch the next after it finishes**; no concurrency.
      4. **User gives an explicit instruction**: translate it into one concrete subtask and dispatch; do not expand the scope on your own.
      5. **User asks about progress / requests a report**: answer from real data (`redteam_score_list` / `redteam_attack_chain` / `redteam_asset_stats` / `redteam_sessions`) and state the next step.

      ## Session isolation (must be preserved when multiple sessions run in parallel)
      - Each session has **its own target binding**: your `redteam_engagement_open` binds only this session and **does not affect other sessions**; subagents automatically inherit the same target through the parent session.
      - Targets in subagent tool calls are inherited from you, so **do not** let a subtask rebind the target; if the user wants a different target, bind explicitly with `redteam_session_bind`.
      - Before and after dispatching, use `redteam_session_info` to confirm you have not drifted onto another session's target.

      ## Verifying subagent reports (not verifying means it did not happen)
      - When a subagent says "got it," verify in the database: `redteam_asset_query` (whether the asset was recorded and when it was discovered), `redteam_vuln_query` (vulnerability status and evidence), `redteam_sessions` (whether the WebShell is Behinder/Godzilla, whether the tunnel is active and `entry_kind` is not self-only), `redteam_chain` (whether steps and actual commands were written).
      - **A finding not recorded = it did not happen**: have it backfill the record before continuing; **a report's "how the credentials were obtained, how the tunnel was built" depends entirely on the attack steps' `tool`/`result`**; a report missing that step cannot be delivered.
      - A tunnel counts as open only if it can actually reach an intranet target; a WebShell counts as an entry point only if the user can connect (Behinder/Godzilla).

      ## When to talk to the user (hard token-saving requirement)
      **Criterion: does this round contain anything new that the user does not know and is worth knowing?**
      Send a message proactively only in the following cases; otherwise **do not output a report**—restating progress every round burns a large number of tokens:
      1. **Scored**: a new scoring item was obtained, or the score of an existing item changed (use the real numbers from `redteam_score_list`);
      2. **New asset discovered**: new asset / new segment / new entry point (tunnel, WebShell, credential)—it is "new," not "scanned again";
      3. **User action needed**: missing key / VPS / tools / account or scope confirmation, or a real blocker (banned, target unreachable, authorization decision needed)—**state "what, why, where to provide" at once**;
      4. **Stage advance or hard failure**: crossing between the five stages, or subagents repeatedly failing or being banned.
      Rules:
      - Report when there is something, and report **increments**: write only what is **new this round** + who to dispatch next; **report the same batch of results only once**, and do not restate it later (avoid "reporting after every subagent finishes").
      - If there is nothing, **say not one word**: quietly dispatch the next subagent (you may dispatch several in a row in the same round without greeting the user first).
      - **When the user is asking you / explicitly requests progress or a report, answer fully as usual** (follow the reporting format below)—that is what the user asked for, not waste.
      - When unsure whether something counts as new, treat it as "the user already knows": **do not say it**.

      ## Reporting format (when the user asks about progress, requests a report, or cases 1–4 trigger)
      1. **Progress**: which stage (① reconnaissance → ② internet asset access → ③ boundary breakthrough → ④ intranet asset access → ⑤ target access), score obtained / maximum (`redteam_score_list`).
      2. **What each agent did this round**: role, which assets were attacked, what was obtained, which ids were recorded.
      3. **Resources in hand**: usable WebShells, tunnels (listen address + reachable segments), credentials and account privileges.
      4. **Next plan**: which role to dispatch, what to attack, which scoring item is expected; **and what the user needs to provide** (key / VPS / account / scope confirmation).
      Distinguish "obtained" from "pending verification" honestly; do not present them as results. **If nothing happened, use "when to talk to the user" above and do not force a report.**

      ## Red lines (restate to your subagents)
      - Start directly from the target the user provides; if the user adds a scope (such as a CIDR block or a domain), execute according to that addition.
      - **Credentials alone do not count as account access**: account-access score requires an actual successful browser login; self-registered/self-built accounts do not count as scoring access (`self_created=true` is only a trace).
      - **A proxy opened on your own VPS / self-hosted server does not count as a tunnel**: the tunnel must clearly state its target-side endpoint (`entry_kind`).
      - Reports include only scored results, and each must be reproducible (target → what was obtained → how (command) → raw request).

# Anchor gate: limits output during the bootstrap phase to avoid an empty first round; the command side fires preflight/open-target/read-skills in a row, and 1024 truncates easily.
# Do not trim tools or change personas. Close it again after compaction. Once lifted, long workspace instructions become pointed file references.
- id: anchor-gate
  name: ./anchor-gate.mjs
  config:
    anchorGate: true
    maxBootstrapSteps: 2
    promoteAfterFirstResponse: true
    bootstrapMaxTokens: 8192
    instructionHint: true

- id: redteam-tools
  name: dsh-purge-community/redteam/tools

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
# publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
# the criterion for host-plane ownership — injection resolves before any session
# exists, so there is no agent to key by. Behind a preset realm those variables
# never reached the model's shell at all. Both shell tools consume the host
# registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
# host-plane too.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

# Both register into the host `tools` registry and provide nothing, so
# they need no realm. The `fs` service and its policy stay in the host.
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────

# Only the model-facing controls. The task REGISTRY stays on the host plane:
# its producers sit outside any realm this file could put it in — `tool-bash`
# above resolves it with `ctx.get`, and an entry-local realm here is invisible
# to every sibling row, so `run_in_background` would answer "background jobs
# unavailable" while these controls sat in the catalog. The registry is keyed by
# owning agent anyway, so one host instance serves every session. What a preset
# chooses is whether its agent can collect and stop background work at all.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ──────────────────────────────────────────────────────────────────

# The skill REGISTRY lives in the host composition and is layered per scope:
# these rows register into THIS preset's layer of it, so they need no realm.
# `skill-filesystem` contributes local-root discovery for agents on this preset, and
# `tool-skill` gives them the catalog and loader; the merged catalog also
# carries whatever the deployment registered globally (repository plugins).
#
# The skill library follows DSH-native skills: place skill files in $DSH_HOME/skills (user-dsh root, rank 400)
# or project-root .dsh/skills and .agents/skills; skill-filesystem auto-discovers them, and the native
# `skill` tool and /skill command work directly. Red team no longer maintains a private skill directory—historical skills have
# been migrated to $DSH_HOME/skills, and the skill library page is browse-only.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  # Bundled skills live in $DSH_HOME/redteam/skills and are synced from the package when the plugin starts.
  # Skill root order is priority (the first occurrence wins for duplicate names): $DSH_HOME/skills must come first,
  # otherwise the user's configured VPS address / key in their own copy would be overwritten by the bundled template (which uses placeholders like `<your-vps-ip>`).
  config:
    # Scan only the two roots "$DSH_HOME/skills + this plugin's bundled copy":
    # disable includeDefaultRoots to avoid pulling .agents/skills and project-level large skill packs (often hundreds)
    # into red-team sessions—that pollutes model context and makes the skill page look stuffed with hundreds of skills.
    includeDefaultRoots: false
    customSkillDirs:
      - !!js dshHomePath('skills')
      - !!js dshHomePath('redteam/skills')

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

# The goal service and session driver stay on the host plane, where the Gateway
# can resolve them. The human command and model-facing tool register into this
# preset's scoped layers.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

# Plan state is per-agent by nature, so an entry-local realm is not a
# workaround here — it is the correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

# `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
# share this realm rather than sit outside it.
#
# `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
# plane, and the rows here resolve that one instance. It takes no configuration,
# keys every fold by Session, and owns the context-meter projection units the
# browser reads for every session — behind a realm those units would come and go
# with whichever presets happen to be mounted. What a preset chooses is whether
# its agent compacts at all, which is `compaction-basic` below.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

# The `subagents` registry and its spawn/fork backends live in the HOST
# composition: the registry is a process singleton whose cross-session queries
# the api-proxy serves to the browser, and a provider name may only be
# registered once. This preset contributes the delegation TOOLS, which resolve
# that host registry.
#
# `workflows` is different — nothing outside an agent reads it — so every row
# that reaches it shares one entry-local realm here, and a consumer left
# outside would resolve a host registry this preset does not populate.
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    # The official experimental-agent-team-profile disables rows with the same name at the profile layer.
    # Red team must explicitly set disabled: false; otherwise only spawn_teammate is available and command dispatch via subagent fails.
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
      disabled: false

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
      disabled: false

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable
        # Subagents are role executors (reconnaissance / asset triage / vulnerability discovery / exploitation / intranet penetration) and **must be leaf nodes**:
        # merely telling them "do not delegate further" is soft—models can ignore it. Here the delegation tools are removed from the
        # subsession tool catalog, so subagents cannot even see subagent / subagent_fork / workflow / ralph.
        # maxDepth is also capped at 1 as a second safeguard (the default 3 levels is too deep and wastes concurrency budget and context).
        maxDepth: 1

    # Fork omits model selection so provider/model stay equal to the parent and
    # the inherited history remains eligible for KV Cache reuse. This preset
    # keeps fork continuable; parent and child inherit the same messaging tool,
    # while the parent id and return guidance follow the inherited history.
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: false
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    # Production dsh does not install these optional providers. Install the
    # matching Bundle in this Profile and restart the Host, then copy this
    # preset and remove `disabled` from the matching tool row. Host availability
    # alone grants no tool.
    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      # Web configurations usually do not install the worker-thread engine; if not started it breaks the entire preset and filters it out of the mode dropdown.
      disabled: true
      config:
        provider: spawn

    - id: workflow-ptc
      name: '@deepseek-ai/dsh-workflow-ptc'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay in the host composition; only
# the model-facing tool is per-session.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
