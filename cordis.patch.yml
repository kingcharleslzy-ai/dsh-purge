# dsh-purge bundle patch
#
# Cleanup and the drill console both live in this plugin (lib/redteam, presets/redteam, skills/redteam).
# Install only dsh-purge; do not attach or link other red-team packages.

# Disable old standalone red-team package entries (if the user previously installed dsh-redteam-mode)
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    # The runtime checks cwd availability; the config layer must not require it.
    personaSuffix: ""

- insert:
    - id: dsh-purge
      name: 'dsh-purge-community'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        excludePresets: []
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "Continue"
        capabilityProtocol: true
        hooksDenyBypass: true

    # Drill console: preset and skill integration (this plugin's lib/redteam)
    - id: dsh-purge-redteam
      name: dsh-purge-community/redteam

    # Built-in agent preset: unrestricted
    - id: dsh-purge-presets
      name: dsh-purge-community/presets-plugin

    # Drill console fact store (SQLite), data in $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge-community/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # Drill console HTTP bridge POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge-community/redteam/ui
