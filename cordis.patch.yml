# dsh-purge bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-purge，不外接、不 link 其它红队包。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    # The runtime checks cwd availability; the config layer must not require it.
    personaSuffix: ""

- insert:
    - id: dsh-purge
      name: 'dsh-purge-community'
      inject: [systemPrompt, tools]
      config:
        enabled: true
        excludePresets: []
        autoApplyOnStart: false
        autoUpdateOnStart: false
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: false
        continueMax: 3
        continueText: "继续"
        capabilityProtocol: true
        hooksDenyBypass: true

    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-purge-redteam
      name: dsh-purge-community/redteam

    # 自带 agent 预设：unrestricted（无限制模式）
    - id: dsh-purge-presets
      name: dsh-purge-community/presets-plugin

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge-community/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # The RedTeam HTTP bridge requires the Host webServer service.
    # Reuse an active Web/TUI provider; otherwise provide a loopback-only
    # listener when the Host package is available (notably in headless profiles).
    - id: dsh-purge-webserver
      name: '@deepseek-ai/dsh-host-webserver'
      disabled: !!js >-
        (() => {
          const require = process.getBuiltinModule('node:module').createRequire(ctx.baseUrl)
          try { require.resolve('@deepseek-ai/dsh-host-webserver/package.json') } catch { return true }
          return [...ctx.loader.entries()].some(entry => entry.options.id !== 'dsh-purge-webserver' && entry.options.name === '@deepseek-ai/dsh-host-webserver' && !entry.disabled)
        })()
      config:
        host: 127.0.0.1
        port: 0

    # RedTeam HTTP bridge POST /redteam/api. Do not leave a pending UI plugin
    # on older Hosts that do not ship the webServer package.
    - id: dsh-purge-redteam-ui
      name: dsh-purge-community/redteam/ui
      disabled: !!js >-
        (() => {
          const entries = [...ctx.loader.entries()]
          if (entries.some(entry => entry.options.name === '@deepseek-ai/dsh-host-webserver' && !entry.disabled)) return false
          const require = process.getBuiltinModule('node:module').createRequire(ctx.baseUrl)
          try { require.resolve('@deepseek-ai/dsh-host-webserver/package.json'); return false } catch { return true }
        })()
